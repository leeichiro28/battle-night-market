<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>擂台夜市 · 對戰活動</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="marquee">
      <span class="eyebrow">Battle Night Market</span>
      <h1>擂台<span>夜市</span></h1>
      <p>選一場活動按下參加,系統自動幫你配對對手。一路打贏晉級,最後留下的人是冠軍。</p>
    </div>

    <div class="card" id="who-card" style="display:none;">
      <label for="name-input">你的暱稱</label>
      <div style="display:flex;gap:8px;">
        <input id="name-input" placeholder="輸入暱稱..." maxlength="16" />
        <button class="btn" id="save-name-btn">儲存</button>
      </div>
    </div>

    <div id="events-list"></div>

    <div class="footer-nav">
      主辦人請到 <a href="admin.html">管理後台</a> 開新活動、設定獎勵
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/supabase-config.js"></script>
  <script src="assets/db.js"></script>
  <script src="assets/home.js"></script>
</body>
</html>
