<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>擂台夜市 · 對戰活動</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <div class="wrap">
    <div class="marquee">
      <span class="eyebrow">Battle Night Market</span>
      <h1>擂台<span>夜市</span></h1>
      <p>選一場活動按下參加,系統自動幫你配對對手。一路打贏晉級,最後留下的人是冠軍。</p>
    </div>

    <div class="card" id="who-card" style="display:none;text-align:center;">
      <p style="margin:0 0 14px;color:var(--ink-dim);">要報名參加活動,請先用 Discord 登入</p>
      <button class="btn block" id="discord-login-btn">使用 Discord 登入</button>
    </div>

    <div id="events-list"></div>

    <div id="archive-box" style="display:none;margin-top:20px;">
      <button type="button" class="btn ghost block" id="archive-toggle"></button>
      <div id="archive-list" style="display:none;margin-top:14px;"></div>
    </div>

    <div class="footer-nav">
      主辦人請到 <a href="admin.html">管理後台</a> 開新活動、設定獎勵
    </div>
  </div>

  <div class="modal-overlay" id="class-modal">
    <div class="modal-card">
      <h3>選擇你的職業</h3>
      <p style="margin-bottom:14px;">這場活動有開啟職業系統,選一個吧(可以不選,用素體參加)</p>
      <div id="class-options" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;"></div>
      <button class="btn ghost block" id="class-skip-btn">不選職業,使用素體</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.27.0/dist/umd/lucide.min.js"></script>
  <script src="assets/supabase-config.js"></script>
  <script src="assets/db.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/header.js"></script>
  <script src="assets/home.js"></script>
</body>
</html>
