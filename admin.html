<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理後台 · 擂台夜市</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <div class="wrap">
    <div class="marquee">
      <span class="eyebrow">Admin</span>
      <h1>後台管理</h1>
      <p>開新活動、控制活動狀態、幫每位參加者填入獎勵</p>
    </div>

    <div class="card">
      <h3 style="font-size:15px;">開新活動</h3>
      <div class="field">
        <label for="new-name">活動名稱</label>
        <input id="new-name" placeholder="例如:週五夜擂台賽" />
      </div>
      <div class="field">
        <label for="new-type">遊戲類型</label>
        <select id="new-type">
          <option value="dice">骰子對戰</option>
          <option value="rps5">五手勢對戰</option>
        </select>
      </div>
      <div class="field">
        <label for="new-deadline">報名截止時間(選填,不填就一直開放到主辦人鎖定名單為止)</label>
        <input type="datetime-local" id="new-deadline" />
      </div>
      <div class="field">
        <label class="check-item" style="margin-bottom:0;">
          <input type="checkbox" id="new-losers" />
          <span>開啟敗部復活賽(輸一場先掉敗部,敗部再輸才淘汰)</span>
        </label>
      </div>

      <div class="field-group" id="dice-rules-box">
        <label>骰子對戰・進階規則(不勾就是最原始版本)</label>
        <div class="check-list" id="dice-rules-list"></div>
      </div>

      <div class="field-group">
        <label>獎勵設定(選填,設定後名次一確定就自動套用,現場也可以再手動修改)</label>
        <div class="field">
          <label for="new-ranks" style="font-size:12px;">要發獎勵到第幾名(最多5名)</label>
          <input type="number" id="new-ranks" min="1" max="5" value="3" />
        </div>
        <div class="action-row" style="margin-bottom:14px;">
          <button type="button" class="btn ghost small" id="mode-manual-btn">手動填每個名次</button>
          <button type="button" class="btn ghost small" id="mode-auto-btn">輸入總數自動分配</button>
        </div>
        <div id="manual-reward-box"></div>
        <div id="auto-reward-box" style="display:none;">
          <div id="auto-reward-list"></div>
          <button type="button" class="btn ghost small" id="add-auto-reward-btn">新增一項獎勵</button>
        </div>
      </div>

      <button class="btn block" id="create-btn">建立活動</button>
    </div>

    <div id="events-admin-list"></div>

    <div id="archive-box" style="display:none;margin-top:20px;">
      <button type="button" class="btn ghost block" id="archive-toggle"></button>
      <div id="archive-list" style="display:none;margin-top:14px;"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.27.0/dist/umd/lucide.min.js"></script>
  <script src="assets/supabase-config.js"></script>
  <script src="assets/db.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/header.js"></script>
  <script src="assets/admin.js"></script>
</body>
</html>
