<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理後台 · 擂台夜市</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <div class="wrap" id="admin-blocked" style="display:none;text-align:center;padding:60px 20px;">
    <p style="font-size:15px;color:var(--ink-dim);">此頁面僅限主辦人使用</p>
  </div>
  <div class="wrap" id="admin-content" style="display:none;">
    <div class="marquee">
      <span class="eyebrow">Admin</span>
      <h1>後台管理</h1>
      <p>開新活動、控制活動狀態、幫每位參加者填入獎勵</p>
    </div>

    <div class="folder-tabs" id="admin-tabs">
      <button type="button" class="folder-tab active" data-tab="create"><i data-lucide="calendar-plus" class="ico"></i>開新活動</button>
      <button type="button" class="folder-tab" data-tab="sponsor"><i data-lucide="gem" class="ico"></i>贊助名單</button>
      <button type="button" class="folder-tab" data-tab="announce"><i data-lucide="megaphone" class="ico"></i>公告</button>
    </div>

    <div class="card folder-tab-card" data-tab-panel="create">
      <div class="field">
        <label for="new-name">活動名稱</label>
        <input id="new-name" placeholder="例如:週五夜擂台賽" />
      </div>
      <div class="field">
        <label for="new-type">遊戲類型</label>
        <select id="new-type">
          <option value="dice">骰子對戰</option>
          <option value="rps5">五手勢對戰</option>
          <option value="auction">夜市拍賣</option>
          <option value="career">職業養成對決</option>
        </select>
      </div>
      <div class="field">
        <label for="new-deadline">報名截止時間(選填，不填就一直開放到主辦人鎖定名單為止)</label>
        <input type="datetime-local" id="new-deadline" />
      </div>
      <div class="field" id="losers-field">
        <label class="check-item" style="margin-bottom:0;">
          <input type="checkbox" id="new-losers" />
          <span>開啟敗部復活賽(輸一場先掉敗部，敗部再輸才淘汰。報名不足6人時系統會自動關閉，單敗淘汰就好)</span>
        </label>
      </div>

      <div class="field-group" id="dice-rules-box">
        <label>骰子對戰・進階規則(不勾就是最原始版本)</label>
        <div class="check-list" id="dice-rules-list"></div>
      </div>

      <div class="field-group" id="rps5-rules-box" style="display:none;">
        <label>五手勢對戰・進階規則(不勾就是最原始版本)</label>
        <div class="check-list" id="rps5-rules-list"></div>
      </div>

      <div class="field-group" id="auction-settings-box" style="display:none;">
        <label>夜市拍賣・活動設定</label>
        <div class="field">
          <label for="auction-budget" style="font-size:12px;">每人起始財神幣(公平起跑，人人一樣)</label>
          <input type="number" id="auction-budget" min="1" value="1000" />
        </div>
        <div class="field">
          <label for="auction-wave-interval" style="font-size:12px;">每波開拍間隔秒數(全自動排程)</label>
          <input type="number" id="auction-wave-interval" min="10" value="90" />
        </div>
        <div class="field">
          <label for="auction-items-per-wave" style="font-size:12px;">每波商品件數</label>
          <input type="number" id="auction-items-per-wave" min="1" max="3" value="1" />
        </div>
        <div class="field">
          <label for="auction-item-limit" style="font-size:12px;">本場商品上限(控制活動總時長，特殊券不算在這個上限內、一定全部出現)</label>
          <input type="number" id="auction-item-limit" min="10" value="28" />
        </div>
        <p style="font-size:12px;color:var(--ink-dim);margin:0;">商品清單(普通/稀有/史詩/傳說/組合包/福袋箱)是固定的，但「開始拍賣」時系統會依上面的上限，按各分級的比例隨機抽選一批出來(每個分級至少會有1件，不會整場都抽不到)，出場順序再自動排程(先普通、中段穿插稀有/史詩、尾聲壓軸傳說)。特殊券固定5張全數出現，不受上限影響。</p>
      </div>

      <div class="field-group">
        <label>獎勵設定(選填，設定後名次一確定就自動套用，現場也可以再手動修改)</label>
        <div class="field">
          <label for="new-ranks" style="font-size:12px;">要發獎勵到第幾名(最多5名)</label>
          <input type="number" id="new-ranks" min="1" max="5" value="3" />
        </div>
        <div class="action-row" style="margin-bottom:14px;">
          <button type="button" class="btn ghost small" id="mode-manual-btn">手動填每個名次</button>
          <button type="button" class="btn ghost small" id="mode-auto-btn">輸入總數自動分配</button>
        </div>
        <div id="manual-reward-box"></div>
        <div id="auto-reward-box" style="display:none;">
          <div id="auto-reward-list"></div>
          <button type="button" class="btn ghost small" id="add-auto-reward-btn">新增一項獎勵</button>
        </div>
      </div>

      <button class="btn block" id="create-btn">建立活動</button>
    </div>

    <div class="card folder-tab-card" data-tab-panel="sponsor" style="display:none;">
      <div class="field">
        <label for="contact-input">主辦人 Discord 聯絡方式(顯示在贊助頁面最下方的募資 CTA)</label>
        <input id="contact-input" placeholder="例如:@主辦人名稱" />
      </div>
      <button class="btn ghost small" id="save-settings-btn">儲存設定</button>
    </div>

    <div data-tab-panel="sponsor" style="display:none;">
      <div class="action-row" style="margin:20px 0 4px;">
        <button type="button" class="btn block" id="add-sponsor-list-btn"><i data-lucide="plus" class="ico"></i>新增贊助名單</button>
      </div>

      <div class="reward-total-box" id="sponsor-cumulative-total" style="display:none;">
        <span><i data-lucide="layers" class="ico"></i>全部活動累積贊助總額(所有贊助名單加總)</span>
      </div>

      <div id="sponsor-latest" style="margin-top:16px;"></div>

      <div id="sponsor-draft-box" style="display:none;margin-top:20px;">
        <div class="sponsor-section-title" style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink-dim);margin:0 2px 10px;">
          <i data-lucide="eye-off" class="ico"></i><span id="sponsor-draft-title"></span>
        </div>
        <div id="sponsor-draft-list"></div>
      </div>

      <div id="sponsor-archive-box" style="display:none;margin-top:20px;">
        <button type="button" class="btn ghost block" id="sponsor-archive-toggle"></button>
        <div id="sponsor-archive-list" style="display:none;margin-top:14px;"></div>
      </div>
    </div>

    <div class="card folder-tab-card" data-tab-panel="announce" style="display:none;">
      <div class="field">
        <label for="announce-type">類型</label>
        <select id="announce-type">
          <option value="event">新活動</option>
          <option value="update">版本更新</option>
          <option value="general">一般公告</option>
        </select>
      </div>
      <div class="field">
        <label for="announce-title">標題</label>
        <input id="announce-title" placeholder="例如:中元夜市盃・鬼牌對決" />
      </div>
      <div class="field">
        <label for="announce-subtitle">小標(圖片上方那行字，選填)</label>
        <input id="announce-subtitle" placeholder="例如:報名開放中 · 8/03 開賽" />
      </div>
      <div class="field">
        <label for="announce-body">內文(選填)</label>
        <textarea id="announce-body" rows="3" placeholder="活動 / 更新內容說明，可以換行"></textarea>
      </div>
      <div class="field" style="display:flex;gap:12px;">
        <div style="flex:1;">
          <label for="announce-cta-text">按鈕文字(選填)</label>
          <input id="announce-cta-text" placeholder="例如:立即報名" />
        </div>
        <div style="flex:1;">
          <label for="announce-cta-link">按鈕連結(選填)</label>
          <input id="announce-cta-link" placeholder="例如:#events-list 或完整網址" />
        </div>
      </div>
      <div class="field">
        <label>封面圖(選填，沒上傳就用類型預設圖示)</label>
        <div class="announce-image-upload">
          <div class="announce-image-preview" id="announce-image-preview"><i data-lucide="image" class="ico"></i></div>
          <label class="btn ghost small" for="announce-image-input" style="cursor:pointer;"><i data-lucide="upload" class="ico"></i>上傳圖片</label>
          <input type="file" id="announce-image-input" accept="image/*" />
        </div>
      </div>
      <button type="button" class="btn block" id="announce-submit-btn"><i data-lucide="send" class="ico"></i>發布公告</button>
    </div>

    <div data-tab-panel="announce" style="display:none;">
      <div id="announce-admin-list" style="margin-top:16px;"></div>
    </div>

    <div data-tab-panel="create">
      <div id="events-admin-list"></div>

      <div id="archive-box" style="display:none;margin-top:20px;">
        <button type="button" class="btn ghost block" id="archive-toggle"></button>
        <div id="archive-list" style="display:none;margin-top:14px;"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.27.0/dist/umd/lucide.min.js"></script>
  <script src="assets/supabase-config.js"></script>
  <script src="assets/db.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/header.js"></script>
  <script src="assets/auction-catalog.js"></script>
  <script src="assets/admin.js"></script>
  <script>
    document.getElementById("admin-tabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".folder-tab");
      if (!btn) return;
      const tab = btn.dataset.tab;
      document.querySelectorAll("#admin-tabs .folder-tab").forEach((b) => b.classList.toggle("active", b === btn));
      document.querySelectorAll("[data-tab-panel]").forEach((p) => {
        p.style.display = p.dataset.tabPanel === tab ? "" : "none";
      });
    });
  </script>
</body>
</html>
