<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>贊助名單 · 擂台夜市</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="assets/style.css" />
<style>
  .sponsor-hero{
    text-align:center;
    padding:34px 20px;
    border-radius:var(--radius);
    background:radial-gradient(circle at 50% 0%, rgba(242,183,5,.14), transparent 65%), var(--panel);
    border:1px solid var(--gold-d);
    margin-bottom:20px;
  }
  .sponsor-hero .view-toggle{margin:0 auto 14px;width:max-content;}
  .sponsor-hero .raised-label{font-size:12px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;}
  .hero-reward-list{margin-top:10px;font-size:clamp(20px,4.4vw,30px);}
  .sponsor-section-title{
    display:flex;align-items:center;gap:8px;
    font-size:15px;font-weight:700;color:var(--ink);
    margin:24px 2px 12px;
  }
  .sponsor-section-title .ico{color:var(--gold);}
  .sponsor-card{
    position:relative;
    border:1px solid var(--gold-d);
    background:linear-gradient(160deg, rgba(242,183,5,.09), rgba(36,32,56,.4));
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .sponsor-card::before{
    content:"";
    position:absolute; top:-40%; left:-20%;
    width:60%; height:180%;
    background:linear-gradient(120deg, transparent, rgba(242,183,5,.08), transparent);
    transform:rotate(20deg);
    pointer-events:none;
  }
  .sponsor-card-top{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .sponsor-card .sname{
    display:flex; align-items:center; gap:8px;
    font-family:'Archivo Black','Noto Sans TC',sans-serif;
    font-size:17px; color:var(--gold);
  }
  .sponsor-card .scount{font-size:11px;color:var(--ink-dim);white-space:nowrap;}
  .sponsor-empty{text-align:center;color:var(--ink-dim);padding:40px 10px;}
  .sponsor-cta{
    text-align:center;
    margin-top:28px;
    padding:22px;
    border-radius:var(--radius);
    border:1px dashed var(--gold-d);
    color:var(--ink-dim);
    font-size:14px;
    line-height:1.9;
  }
  .sponsor-cta b{color:var(--gold);}

  /* 歷史贊助名單:外層跟首頁「活動已結束」同一種收合按鈕,展開後裡面是每份名單各自一個 game-group 收合卡片 */
  .sponsor-history-box{margin-top:28px;}
  .sponsor-history-list{margin-top:14px;}
  .sponsor-history-list .game-group:last-child{margin-bottom:0;}
  .history-list-total{
    padding:14px 20px;
    display:flex;align-items:center;gap:8px;
    justify-content:flex-end;
    font-size:13px;color:var(--ink-dim);
  }
  .history-list-total b{color:var(--gold);font-size:15px;margin-left:2px;}
</style>
</head>
<body>
  <div id="site-header"></div>
  <div class="wrap">
    <div class="marquee">
      <span class="eyebrow"><i data-lucide="gem" class="ico"></i>Sponsors</span>
      <h1>贊助名單</h1>
      <p>感謝每一位讓擂台夜市持續舉辦下去的贊助者</p>
    </div>

    <div class="sponsor-hero">
      <div class="view-toggle" id="raised-view-toggle">
        <button type="button" class="view-toggle-btn active" data-view="current"><i data-lucide="flame" class="ico"></i>本次活動</button>
        <button type="button" class="view-toggle-btn" data-view="total"><i data-lucide="layers" class="ico"></i>全部活動累積</button>
      </div>
      <div class="raised-label" id="raised-label">本次活動贊助總額</div>
      <div class="hero-reward-list" id="raised-value">載入中...</div>
    </div>

    <div class="sponsor-section-title"><i data-lucide="sparkles" class="ico"></i>最新贊助名單</div>
    <div id="sponsor-list"></div>

    <div class="sponsor-history-box" id="history-box" style="display:none;">
      <button type="button" class="btn ghost block" id="history-toggle"></button>
      <div class="sponsor-history-list" id="history-list" style="display:none;"></div>
    </div>

    <div class="sponsor-cta" id="sponsor-cta"></div>

    <div class="footer-nav"><a href="index.html"><i data-lucide="arrow-left" class="ico"></i>回活動列表</a></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.27.0/dist/umd/lucide.min.js"></script>
  <script src="assets/supabase-config.js"></script>
  <script src="assets/db.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/header.js"></script>
  <script src="assets/sponsors.js"></script>
</body>
</html>
