<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>骰子對戰 · 擂台夜市</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <div class="wrap">
    <div class="marquee">
      <span class="eyebrow" id="page-eyebrow">骰子對戰</span>
      <h1>擲出你的命運</h1>
    </div>

    <div class="card">
      <div id="battle-stage"></div>
      <div class="timer-bar"><div id="timer-fill" style="width:100%"></div></div>

      <div id="controls" style="margin-top:14px;">
        <div id="stance-row" class="action-row" style="display:none;justify-content:center;margin-bottom:12px;">
          <button class="btn ghost small" id="stance-attack">猛攻</button>
          <button class="btn ghost small" id="stance-defense">穩紮穩打</button>
        </div>
        <div id="pre-roll-options" class="action-row" style="justify-content:center;margin-bottom:14px;">
          <button class="btn ghost small" id="shield-toggle">使用防禦骰</button>
          <button class="btn ghost small" id="allin-toggle" style="display:none;">背水一戰(傷害x2)</button>
          <button class="btn ghost small" id="freebet-toggle" style="display:none;">自由加注</button>
          <button class="btn ghost small" id="gamble-toggle" style="display:none;">雙骰豪賭</button>
          <button class="btn ghost small" id="ult-toggle" style="display:none;border-color:var(--gold);color:var(--gold);"></button>
        </div>
        <div style="text-align:center;margin-bottom:12px;">
          <span class="reward-badge" id="rage-tag" style="display:none;"></span>
        </div>
        <button class="btn block" id="roll-btn">擲骰</button>
        <div class="status-msg" id="game-status">等待雙方擲骰...</div>
      </div>
    </div>

    <div id="battle-watch"></div>

    <div class="footer-nav" id="back-link" style="display:none;"><a href="index.html"><i data-lucide="arrow-left" class="ico"></i>回活動列表</a></div>
  </div>

  <button class="btn ghost rule-fab" id="rule-fab-btn"><i data-lucide="book-open" class="ico"></i><span class="fab-label">規則說明</span></button>
  <div class="modal-overlay" id="rule-modal">
    <div class="modal-card">
      <h3>骰子對戰規則</h3>
      <div id="rule-content"></div>
      <button class="btn ghost block" id="rule-close-btn" style="margin-top:14px;">關閉</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.27.0/dist/umd/lucide.min.js"></script>
  <script src="assets/supabase-config.js"></script>
  <script src="assets/db.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/header.js"></script>
  <script src="assets/battle-view.js"></script>
  <script src="assets/dice.js"></script>
</body>
</html>
